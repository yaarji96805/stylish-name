<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stylish Name Generator</title><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:20px}h1{color:#ff3c78}input{padding:15px;width:90%;max-width:400px;border-radius:10px;border:none;font-size:18px;margin-top:15px}.box{background:#1e1e1e;margin:12px auto;padding:15px;border-radius:10px;max-width:500px;display:flex;justify-content:space-between;align-items:center}button{background:#ff3c78;color:#fff;border:none;padding:8px 15px;border-radius:6px}</style></head><body><h1>🔥 Stylish Name Generator</h1><input type="text" id="nameInput" placeholder="Type Here... e.g. Yaar Ji" onkeyup="generate()"><div id="result"></div><script>function generate(){let name=document.getElementById("nameInput").value;if(!name)return document.getElementById("result").innerHTML="";let styles=[a=>`꧁༒☬${a}☬༒꧂`,a=>`★彡${a}彡★`,a=>`𝕊𝕋𝕐𝕃𝕀𝕊ℍ ${a}`,a=>`꧁ ${a} ꧂`,a=>`☆ ${a} ☆`,a=>`『${a}』`,a=>`◥ ${a} ◤`,a=>`♛ ${a} ♛`,a=>`🔥 ${a} 🔥`,a=>`𝓢𝓽𝔂𝓵𝓲𝓼𝓱 ${a}`];let html="";styles.forEach(fn=>{let s=fn(name);html+=`<div class=box><span>${s}</span><button onclick=navigator.clipboard.writeText('${s}');this.innerText='Copied!'>Copy</button></div>`});document.getElementById("result").innerHTML=html}</script></body></html>
